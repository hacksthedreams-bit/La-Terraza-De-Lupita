<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — La Terraza de Lupita</title>
<meta name="theme-color" content="#0E0B09">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0E0B09;
  --cream:#F2EBDA;
  --cream-soft:rgba(242,235,218,.75);
  --gold:#C49A5B;
  --accent:#C5301E;
}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:24px;
}
.error-page{max-width:480px}
.error-page__code{
  font-family:'Fraunces','Georgia',serif;
  font-size:clamp(5rem,15vw,9rem);
  font-weight:800;
  color:var(--gold);
  line-height:1;
  margin-bottom:16px;
}
.error-page__title{
  font-family:'Fraunces','Georgia',serif;
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:700;
  margin-bottom:12px;
}
.error-page__text{
  color:var(--cream-soft);
  font-size:.95rem;
  line-height:1.7;
  margin-bottom:32px;
}
.error-page__btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 32px;
  background:var(--cream);color:var(--bg);
  border-radius:100px;
  font-size:.9rem;font-weight:600;
  text-decoration:none;
  transition:all .25s;
}
.error-page__btn:hover{
  background:#fff;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.error-page__emoji{
  font-size:3rem;
  display:block;
  margin-bottom:24px;
}
</style>
</head>
<body>
<div class="error-page">
  <span class="error-page__emoji">🌮</span>
  <div class="error-page__code">404</div>
  <h1 class="error-page__title">Esta página se fue de parranda</h1>
  <p class="error-page__text">No encontramos lo que buscas, pero la carta sigue abierta. Vuelve al inicio y explora nuestros platos.</p>
  <a class="error-page__btn" href="/">Volver al inicio</a>
</div>
</body>
</html>
